[pytest]
# pytest.ini — place at PROJECT ROOT (same level as DocumentProcessor/)
#
# Default run  (unit tests only — fast, no network):
#   pytest tests/ocr/
#
# Run with live GCV + LLM calls:
#   pytest tests/ocr/ --run-integration
#
# Run only a specific component:
#   pytest tests/ocr/test_models.py
#   pytest tests/ocr/test_gcv.py
#   pytest tests/ocr/test_llm.py
#   pytest tests/ocr/test_pipeline.py
#
# Run only slow live-API tests:
#   pytest tests/ocr/ --run-integration -m slow
#
# Run everything except slow tests:
#   pytest tests/ocr/ --run-integration -m "not slow"

markers =
    integration: live GCV / LLM API calls (enable with --run-integration)
    slow: tests that take > 10 s (subset of integration)

addopts = -v --tb=short

testpaths = tests/ocr
