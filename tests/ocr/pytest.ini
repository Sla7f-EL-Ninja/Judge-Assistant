[pytest]
# pytest.ini — place this at the PROJECT ROOT (same level as DocumentProcessor/)
#
# Run only fast OCR-only tests (default):
#   pytest tests/ocr/
#
# Run everything including full pipeline (needs Mongo + Qdrant running):
#   pytest tests/ocr/ --run-integration
#
# Run all:
#   pytest tests/ocr/ --run-integration

markers =
    integration: end-to-end tests that require MongoDB, Qdrant, and all services running
    slow: marks tests as slow (live LLM or GCV calls)

addopts = -v --tb=short

testpaths = tests/ocr
 