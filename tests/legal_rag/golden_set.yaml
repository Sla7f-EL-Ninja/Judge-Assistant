# preprocessor_golden_set.yaml
# ----------------
# Curated test cases for evaluating the Preprocessor pipeline.
# Each entry includes:
# - id: Unique identifier for the test case.
# - category: The test scenario type:
#     "straightforward"   — already clear; must NOT be rewritten.
#     "rewrite"           — colloquial/informal; needs light legal rephrasing only.
#     "number_conversion" — contains word-numerals that must be converted to digits.
#     "off_topic"         — not a legal question; must be rejected as-is.
#     "edge_case"         — ambiguous or mixed; tests conservative rewrite behaviour.
# - query: The raw input question sent to the preprocessor.
# - should_rewrite: Whether the rewritten_question should differ from the query.
# - expected_classification: The expected Arabic classification label.
# - expected_rewritten_question: The ideal output (null means identical to query).
# - notes: Human-readable explanation of what behaviour is being tested.
# - should_fail: true if the query must be classified as "خارج السياق".

